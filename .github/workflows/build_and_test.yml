name: CI

on:
  push:
    branches: [jazzy]
  pull_request:
    branches: [jazzy]
    types: [opened, reopened, synchronize]

jobs:
  build_and_test_desktop:
    runs-on: ubuntu-24.04
    steps:
    - name: Install Java
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y openjdk-21-jre
    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y libasio-dev libbenchmark-dev
    - uses: ros-tooling/setup-ros@0.7.19
      with:
        required-ros-distributions: jazzy
    - uses: actions/checkout@v5
    # setup-ros installs ros-jazzy-desktop, so build on top of it: only the ros2-java repos are
    # imported from ros2_java_desktop.repos (the rest of that file is the ROS 2 core, needed only
    # when building for a distribution without binaries). Building the core from source on Noble
    # also failed with "No module named 'ament_package'" in ament_cmake_core.
    - name: Setup workspace with the ros2-java repos
      run: |
        mkdir -p ros2_java_ws/src
        cd ros2_java_ws
        python3 - <<'EOF'
        import yaml
        d = yaml.safe_load(open('${{ github.workspace }}/ros2_java_desktop.repos'))
        d['repositories'] = {k: v for k, v in d['repositories'].items() if k.startswith('ros2-java/') and k != 'ros2-java/ros2_java'}
        yaml.safe_dump(d, open('java.repos', 'w'))
        EOF
        vcs import --input java.repos src
        # Use checked out version of ros2_java
        ln --symbolic ${{ github.workspace }} src/ros2-java/ros2_java
    - name: Run Colcon Build
      run: |
        source /opt/ros/jazzy/setup.bash
        cd ros2_java_ws
        colcon build --event-handlers=console_direct+ --symlink-install --packages-up-to rosidl_generator_java_tests rosidl_generator_java rcljava_common rcljava
    - name: Diagnostics on failure
      if: failure()
      run: |
        cd ros2_java_ws
        echo "== packages built"; ls install
        echo "== resource index entries"; find install -path '*ament_index/resource_index/*' | sort
        echo "== ament_java_resources install tree"; find install/ament_java_resources -type f -o -type l | sort
        echo "== environment colcon gave the rcljava_common build"
        grep -h -o 'AMENT_PREFIX_PATH=[^ ]*' log/latest_build/rcljava_common/command.log 2>/dev/null | head -2
        echo "== ament_build_type_gradle install tree and hook contents"
        find install/ament_build_type_gradle -type f -o -type l | sort
        for f in $(find install/ament_build_type_gradle -name '*.dsv' -o -name '*.sh' | sort); do echo "--- $f"; cat "$f"; done
        echo "== colcon version"; colcon version-check 2>/dev/null | head -30
        echo "== how colcon chains the hooks of an ament_cmake package (ament_java_resources)"
        for f in package.dsv local_setup.dsv environment/ament_prefix_path.dsv hook/cmake_prefix_path.dsv; do echo "--- $f"; cat install/ament_java_resources/share/ament_java_resources/$f; done
        echo "== full colcon invocation line for rcljava_common"
        grep -m1 "Invoking command" log/latest_build/rcljava_common/command.log | tr ' ' '\n' | grep -E "^(AMENT_PREFIX_PATH|CMAKE_PREFIX_PATH|PYTHONPATH|/usr/bin/cmake)" | cut -c1-600
    - name: Run Colcon Test
      run: |
        source /opt/ros/jazzy/setup.bash
        cd ros2_java_ws
        source install/setup.bash
        colcon test --event-handlers=console_direct+ --packages-select rosidl_generator_java_tests rosidl_generator_java rcljava_common rcljava
        colcon test-result --verbose
