name: CI

on:
  push:
    branches: [jazzy]
  pull_request:
    branches: [jazzy]
    types: [opened, reopened, synchronize]

jobs:
  build_and_test_desktop:
    runs-on: ubuntu-24.04
    steps:
    - name: Install Java
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y openjdk-21-jre
    - uses: actions/checkout@v4.2.1
    - uses: ros-tooling/setup-ros@0.7.9
      with:
        required-ros-distributions: jazzy
    - uses: ros-tooling/action-ros-ci@0.3.13
      with:
        package-name: rosidl_generator_java rcljava_common rcljava
        target-ros2-distro: jazzy
        vcs-repo-file-url: ${{ github.workspace }}/ros2_java_desktop.repos

  build_and_test_android:
    runs-on: ubuntu-24.04
    steps:
    - name: Install Java
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y openjdk-21-jre
    - name: Install SDKMan
      run: |
        curl -s "https://get.sdkman.io" | bash
        source "$HOME/.sdkman/bin/sdkman-init.sh"
    - name: Install Gradle 8.6
      run: |
        sdk install gradle 8.6
    - uses: actions/checkout@v4.2.1
    - uses: ros-tooling/setup-ros@0.7.9
      with:
        required-ros-distributions: jazzy
    - uses: ros-tooling/action-ros-ci@0.3.13
      with:
        package-name: rosidl_generator_java rcljava_common rcljava
        target-ros2-distro: jazzy
        vcs-repo-file-url: ${{ github.workspace }}/ros2_java_desktop.repos
